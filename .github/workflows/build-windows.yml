name: CI - Windows x64

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & package (x64)
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      QT_VERSION: 6.8.2
      VLC_VERSION: 3.0.21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (aqtinstall, official binaries)
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          # QtSvg is part of the base Qt 6 desktop archive - do NOT pass it as
          # a module (aqtinstall has no standalone qtsvg module for Qt 6).
          cache: true

      - name: Download libVLC SDK (pinned release from VideoLAN)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://get.videolan.org/vlc/$env:VLC_VERSION/win64/vlc-$env:VLC_VERSION-win64.7z"
          $archive = Join-Path $env:RUNNER_TEMP "vlc.7z"

          Write-Host "Downloading $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10
          } catch {
            Write-Host "Invoke-WebRequest failed: $($_.Exception.Message) - trying curl.exe"
            & curl.exe -L -o $archive $url
            if ($LASTEXITCODE -ne 0) { throw "curl download failed (exit $LASTEXITCODE)" }
          }
          if (-not (Test-Path $archive)) { throw "Archive was not written to $archive" }
          Write-Host "Downloaded $((Get-Item $archive).Length) bytes"

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if ($cmd) { $sevenZip = $cmd.Source } else { throw "7-Zip not found on runner" }
          }
          Write-Host "7-Zip: $sevenZip"

          $extractDir = Join-Path $env:RUNNER_TEMP "vlc"
          & $sevenZip x $archive "-o$extractDir" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract VLC archive (exit $LASTEXITCODE)" }

          # The SDK root is the directory that CONTAINS sdk/include/vlc/vlc.h.
          # Check the extraction root itself first, then its subdirectories.
          $sdkRoot = @($extractDir) + @(Get-ChildItem $extractDir -Directory -Recurse -Depth 3 -ErrorAction SilentlyContinue) |
            Where-Object { Test-Path (Join-Path $_.FullName "sdk\include\vlc\vlc.h") } |
            Select-Object -First 1
          if (-not $sdkRoot) {
            Write-Host "VLC SDK not found after extraction. Extracted tree:"
            Get-ChildItem $extractDir -Recurse -Depth 2 | ForEach-Object { $_.FullName }
            throw "VLC SDK (sdk/include/vlc/vlc.h) not found after extraction"
          }
          "VLC_DIR=$($sdkRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VLC_DIR=$($sdkRoot.FullName)"

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:QT_ROOT = "${{ steps.install-qt.outputs.qtpath }}"
          cmake --preset ci-windows

      - name: Build (Release x64)
        shell: pwsh
        run: cmake --build --preset ci-windows --config Release

      - name: Run unit tests
        shell: pwsh
        run: ctest --preset ci-windows -C Release --output-on-failure

      - name: Package application (portable ZIP + installer + checksums)
        shell: pwsh
        env:
          QT_ROOT: ${{ steps.install-qt.outputs.qtpath }}
        run: |
          powershell -ExecutionPolicy Bypass -File tools/package-windows.ps1 `
            -AppExe "build/ci-windows/Release/STGR-IpTV.exe" `
            -QtBin "$env:QT_ROOT/bin" `
            -VlcDir "$env:VLC_DIR" `
            -Version "1.0.0" `
            -OutDir "dist"

      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          $required = @("dist/staging/STGR-IpTV.exe", "dist/staging/libvlc.dll", "dist/staging/libvlccore.dll", "dist/staging/plugins")
          foreach ($r in $required) {
            if (-not (Test-Path $r)) { throw "Missing packaged file: $r" }
          }
          $exe = Get-Item "dist/staging/STGR-IpTV.exe"
          if ($exe.Length -lt 1MB) { throw "Suspiciously small executable" }
          if (-not (Test-Path "dist/SHA256SUMS.txt")) { throw "Missing checksums" }
          Write-Host "Packaging verified: exe $($exe.Length) bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-artifacts
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload portable staging (debugging aid)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-staging
          path: dist/staging
