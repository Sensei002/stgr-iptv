name: Release - Windows x64

# Publish-only workflow: reuses the packaged artifacts produced by the CI
# build (build-windows.yml) for the tagged commit - no rebuild happens here.
#
# Flow:  push commit -> CI builds/tests/packages (uploads artifact)
#        -> push tag vX.Y.Z -> this workflow downloads the artifact and
#        publishes the release.
#
# The tag version MUST match the project version in CMakeLists.txt, because
# the CI build names the packaged files after that version.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish release (reuses CI build)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Releasing version: $version"

      - name: Locate CI build for this commit
        id: find-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&event=push&status=success&per_page=100"
          $runs = Invoke-RestMethod -Headers $headers -Uri $uri -UserAgent "stgr"
          $build = $runs.workflow_runs | Where-Object {
            $_.path -eq ".github/workflows/build-windows.yml" -and $_.head_branch -eq "main"
          } | Select-Object -First 1
          if (-not $build) {
            Write-Host "::error::No successful CI build found for commit $env:GITHUB_SHA."
            Write-Host "::error::Push the commit to main (so CI packages it) before tagging."
            exit 1
          }
          "run_id=$($build.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using CI build run $($build.id) (commit $env:GITHUB_SHA)"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-artifacts
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Verify artifacts
        shell: pwsh
        run: |
          Write-Host "Artifacts in dist:"
          Get-ChildItem dist | Format-Table Name, Length
          $available = (Get-ChildItem dist -File | ForEach-Object { $_.Name }) -join ', '
          $required = @(
            "dist/STGR-IpTV-Setup-v$env:RELEASE_VERSION-x64.exe",
            "dist/STGR-IpTV-v$env:RELEASE_VERSION-x64-portable.zip",
            "dist/SHA256SUMS.txt"
          )
          foreach ($r in $required) {
            if (-not (Test-Path $r)) {
              throw "Missing packaged file: $r (found: $available) - did you bump CMakeLists.txt to $env:RELEASE_VERSION before tagging?"
            }
          }
          Write-Host "Release artifacts verified for v$env:RELEASE_VERSION."

      - name: Sign artifacts (only when secrets are configured)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "No CODE_SIGNING_CERT_BASE64 secret - publishing unsigned release (see docs/CODE-SIGNING.md)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))

          $targets = @()
          $targets += Get-ChildItem "dist" -Filter "STGR-IpTV-Setup-*.exe"

          # Sign the exe inside the portable ZIP too: extract, sign, rezip.
          $zip = Get-ChildItem "dist" -Filter "STGR-IpTV-*-portable.zip" | Select-Object -First 1
          if ($zip) {
            $tmp = Join-Path $env:RUNNER_TEMP "portable"
            Expand-Archive -Path $zip.FullName -DestinationPath $tmp -Force
            $inner = Get-ChildItem $tmp -Filter "STGR-IpTV.exe" | Select-Object -First 1
            if ($inner) { $targets += $inner }
          }

          foreach ($t in $targets) {
            & signtool sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /t http://timestamp.digicert.com $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($t.FullName)" }
          }

          if ($zip) {
            Compress-Archive -Path (Join-Path $tmp "*") -DestinationPath $zip.FullName -Force
          }
          Write-Host "Artifacts signed."

      - name: Recompute checksums after signing
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "dist" -Filter "STGR-IpTV-Setup-*.exe"
          $files += Get-ChildItem "dist" -Filter "*.zip"
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "STGR IpTV ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/STGR-IpTV-Setup-*.exe
            dist/STGR-IpTV-*-portable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
